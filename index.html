<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Leaderboard Engine</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ff4a4a;
            font-size: 36px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .search-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input[type="text"] {
            background-color: #1e1e1e;
            border: 2px solid #333;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            width: 300px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button.search-btn {
            background-color: #ff4a4a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .channel-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            text-align: left;
        }
        .channel-card:hover {
            border-color: #ff4a4a;
        }
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff4a4a;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            background-color: #25273c;
        }
        .channel-name {
            font-size: 15px;
            font-weight: bold;
            word-break: break-word;
        }
        .sub-count-line {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 15px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: bold;
            display: block;
            font-size: 20px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            background-color: #121212;
            border: 1px solid #333;
            color: #ddd;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
        }
        .action-btn:hover {
            border-color: #ff4a4a;
            color: white;
        }
        .admin-panel {
            margin-top: 60px;
            padding: 25px;
            background-color: #1e1e1e;
            border: 2px dashed #ff4a4a;
            border-radius: 8px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-panel p {
            margin: 0 0 15px 0;
            font-weight: bold;
            color: #ff4a4a;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #121212;
            color: #ffffff;
            border: 2px solid #444;
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #ff4a4a;
        }
        .sync-btn {
            background-color: #ff4a4a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #statusMessage {
            font-size: 16px;
            color: #ff4a4a;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>All FYSC Season 1 Channels</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>

        <div class="search-wrapper">
            <form id="searchForm" onsubmit="executeSearch(); return false;" style="display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Search channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div id="statusMessage">Ready! Paste your lcedit text data into the console tool down below.</div>
        <div class="channels-grid" id="channelsGrid"></div>

        <!-- STRIPPED DOWN LOCAL INPUT MANAGEMENT ENGINE -->
        <div class="admin-panel">
            <p>STREAMER CONTROL CONSOLE</p>
            <textarea id="jsonPasteInput" placeholder="Paste your raw stream data code text here..."></textarea>
            <br>
            <button type="button" class="sync-btn" id="syncBtn">Sync Channels Grid</button>
        </div>
    </div>

    <script>
        let masterChannelsList = [];

        // Pull stored channel profiles out of browser local memory instantly upon website reload
        if (localStorage.getItem("fysc_offline_ledger")) {
            try {
                masterChannelsList = JSON.parse(localStorage.getItem("fysc_offline_ledger"));
                masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                document.getElementById("statusMessage").style.display = "none";
                buildDashboardGrid(masterChannelsList);
            } catch(e) { console.error(e); }
        }

        document.getElementById("syncBtn").addEventListener("click", function() {
            const rawText = document.getElementById("jsonPasteInput").value.trim();
            if (!rawText) return alert("Please paste the data text block first!");
            try {
                const parsed = JSON.parse(rawText);
                const incoming = parsed.counters || parsed.data || parsed.channels || parsed;
                if (Array.isArray(incoming)) {
                    masterChannelsList = incoming;
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    localStorage.setItem("fysc_offline_ledger", JSON.stringify(masterChannelsList));
                    document.getElementById("statusMessage").style.display = "none";
                    buildDashboardGrid(masterChannelsList);
                    
                    alert("Success! Loaded total tracked stream entries: " + masterChannelsList.length);
                    document.getElementById("jsonPasteInput").value = "";
                } else {
                    alert("Data format error. Make sure you copy the entire raw array object.");
                }
            } catch (err) { alert("Parsing failed: Verify you copied the text block completely."); }
        });

        function buildDashboardGrid(listToRender) {
            const grid = document.getElementById("channelsGrid");
            grid.innerHTML = "";

            listToRender.forEach(user => {
                const trueRank = masterChannelsList.indexOf(user) + 1;
                const currentCount = Math.floor(Number(user.count || 0));
                const avatarImg = user.image || "https://lcedit.com";

                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="rank-badge">#${trueRank}</div>
                    <div class="card-header">
                        <img class="avatar" src="${avatarImg}"><span class="channel-name">${user.name}</span>
                    </div>
                    <div class="sub-count-line">
                        Subscribers: <span class="sub-number" id="card-count-${trueRank}">${currentCount.toLocaleString()}</span>
                    </div>
                    <div class="card-actions">
                        <a class="action-btn" href="https://youtube.com{encodeURIComponent(user.name)}" target="_blank">Go to Channel</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Active Ticker odometer emulation flutters values smoothly every 2 seconds matching lcedit algorithms
        setInterval(function() {
            if (masterChannelsList.length === 0) return;
