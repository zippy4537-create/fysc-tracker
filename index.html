<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Live Tracker</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 28px; /* Slightly bigger font for the active odometer look */
            transition: color 0.3s ease;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing</p>
        
        <input type="text" id="usernameInput" placeholder="Search User" onkeyup="if(event.key === 'Enter') lookupUser()">
        <br>
        <button onclick="lookupUser()">Search</button>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Loading dashboard data...</p>
        </div>
    </div>

    <script>
        let channelsList = [];
        let updateIntervalTimer = null;
        let activeUser = null;

        // Automatically fetch your configurations from the separate file
        async function loadData() {
            const resultDiv = document.getElementById("resultArea");
            try {
                // Prevent GitHub cache layers from sticking
                const response = await fetch('data.json?t=' + Date.now());
                const parsedData = await response.json();
                
                // Read directly from lcedit JSON structural exports array
                channelsList = parsedData.data || parsedData.counters || [];
                resultDiv.innerHTML = `<p style="color: #888; margin: 0;">Ready! Enter your channel name above.</p>`;
            } catch (e) {
                console.error("Failed to load data.json:", e);
                resultDiv.innerHTML = `<p style="color: #ff4a4a; margin: 0;">Error: Could not link to data.json file.</p>`;
            }
        }

        // Run data load immediately
        loadData();

        function lookupUser() {
            // Stop any background live updates from a previous search
            clearInterval(updateIntervalTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }
            
            if (channelsList.length === 0) {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Data is still loading or empty. Please wait a second.</p>";
                return;
            }

            activeUser = channelsList.find(user => (user.name || "").trim().toLowerCase() === searchInput);
            
            if (activeUser) {
                renderUserCard();
                
                // START THE LIVE FEED LOGIC: 
                // This script recalculates and ticks the counter up automatically every 2 seconds
                updateIntervalTimer = setInterval(() => {
                    simulateLiveGains();
                }, 2000); 

            } else {
                resultDiv.innerHTML = `
                    <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                    <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure the spelling matches your stream registry layout exactly.</p>
                `;
            }
        }

        function renderUserCard() {
            const resultDiv = document.getElementById("resultArea");
            const userSubs = Math.floor(activeUser.count || activeUser.lastCount || 0);
            const userImage = activeUser.image || "https://ggpht.com";

            resultDiv.innerHTML = `
                <img class="avatar" src="${userImage}" alt="Avatar">
                <div class="stat-line">Channel: <span style="font-weight:bold; color:white;">${activeUser.name}</span></div>
                <div class="stat-line">Subscribers: <span class="highlight" id="liveCounter">${userSubs.toLocaleString()}</span></div>
                <div class="stat-line" style="font-size:12px; color:#148c50; margin-top:8px; display:flex; align-items:center; justify-content:center;">
                    <span class="live-indicator"></span> Updating Live via lcedit string
                </div>
            `;
        }

        function simulateLiveGains() {
            if (!activeUser) return;

            // Look inside the user's lcedit array data properties for min_gain / max_gain parameters
            // If they aren't configured, fall back to standard stream increments (-2 to +4)
            const minGain = typeof activeUser.min_gain !== 'undefined' ? Number(activeUser.min_gain) : -2;
            const maxGain = typeof activeUser.max_gain !== 'undefined' ? Number(activeUser.max_gain) : 4;
            
            // Generate a random increment based on your lcedit settings matching your live stream flow
            const change = Math.floor(Math.random() * (maxGain - minGain + 1)) + minGain;
            
            // Adjust current base counters values 
            if (activeUser.count) activeUser.count += change;
            if (activeUser.lastCount) activeUser.lastCount += change;

            // Target the dashboard UI number element container directly and inject the new live counter string
            const counterElement = document.getElementById("liveCounter");
            if (counterElement) {
                const currentCount = Math.floor(activeUser.count || activeUser.lastCount || 0);
                counterElement.innerText = currentCount.toLocaleString();
                
                // Flashes colors matching positive/negative gains just like your streamer overlay dashboard template
                if (change > 0) {
                    counterElement.style.color = "#148c50"; // Green for plus
                } else if (change < 0) {
                    counterElement.style.color = "#b43c3c"; // Red for minus
                }
                
                // Fade colors back to the custom signature theme red hue after a brief moment
                setTimeout(() => {
                    counterElement.style.color = "#ff4a4a";
                }, 400);
            }
        }
    </script>
</body>
</html>
