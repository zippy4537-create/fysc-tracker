<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Live Engine</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        .search-wrapper {
            position: relative;
            width: 85%;
            margin: 0 auto 15px auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        /* Suggestion Dropdown Panel */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #252525;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            text-align: left;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #ddd;
            font-size: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background-color: #ff4a4a;
            color: white;
        }
        .suggestion-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
            transition: color 0.15s ease-in-out;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <form onsubmit="handleFormSubmit(event)">
            <div class="search-wrapper">
                <input type="text" id="usernameInput" placeholder="Enter Channel Name" autocomplete="off" oninput="handleInputDrawing()">
                <div class="suggestions-box" id="suggestionsBox"></div>
            </div>
            <button type="submit">Search Channel</button>
        </form>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Loading database data...</p>
        </div>
    </div>

    <script>
        let channelsList = [];
        let liveUpdateTimer = null;
        let activeUser = null;

        // Load live data directly from your Livecountsedit Stream Hub
        async function loadData() {
            const resultDiv = document.getElementById("resultArea");
            try {
                const response = await fetch('https://lcedit.com');
                const parsedData = await response.json();
                
                channelsList = parsedData.channels || [];
                
                // Sort by count descending for perfect live ranking numbers
                channelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));

                resultDiv.innerHTML = `<p style="color: #888; margin: 0;">Ready! Enter your channel name above.</p>`;
            } catch (e) {
                console.error("Failed to load live data configuration:", e);
                resultDiv.innerHTML = `<p style="color: #ff4a4a; margin: 0;">Error connecting to live server. Please try again.</p>`;
            }
        }

        loadData();

        // Handle auto-complete logic as users type
        function handleInputDrawing() {
            const inputVal = document.getElementById("usernameInput").value.trim().toLowerCase();
            const suggestionsBox = document.getElementById("suggestionsBox");
            
            if (inputVal === "") {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            // Filter out names that contain the typed letters
            const matches = channelsList.filter(user => {
                const name = (user.name || "").toString().toLowerCase();
                return name.includes(inputVal);
            }).slice(0, 6); // Cap the list at 6 total options for clean UI sizing

            if (matches.length === 0) {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            suggestionsBox.innerHTML = "";
            matches.forEach(user => {
                const item = document.createElement("div");
                item.className = "suggestion-item";
                
                const avatarUrl = user.image || "https://placeholder.com";
                item.innerHTML = `
                    <img class="suggestion-avatar" src="${avatarUrl}">
                    <span>${user.name}</span>
                `;
                
                // Clicking an element fills out the search box and loads their dashboard
                item.onclick = function() {
                    document.getElementById("usernameInput").value = user.name;
                    suggestionsBox.innerHTML = "";
                    suggestionsBox.style.display = "none";
                    startLiveTracking();
                };
                suggestionsBox.appendChild(item);
            });

            suggestionsBox.style.display = "block";
        }

        // Hide suggestions if the user clicks anywhere outside the input box
        document.addEventListener("click", function(e) {
            if (e.target.id !== "usernameInput") {
                document.getElementById("suggestionsBox").style.display = "none";
            }
        });

        function handleFormSubmit(event) {
            event.preventDefault();
            // Close suggestions panel
            document.getElementById("suggestionsBox").style.display = "none";
            startLiveTracking();
        }

        function startLiveTracking() {
            clearInterval(liveUpdateTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }
            
            if (channelsList.length === 0) {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Database is still loading. Please wait a second.</p>";
                return;
            }

            activeUser = channelsList.find(user => {
                const currentName = (user.name || "").toString().trim().toLowerCase();
                return currentName === searchInput;
            });
            
            if (activeUser) {
                if (typeof activeUser.currentRunningCount === 'undefined') {
                    activeUser.currentRunningCount = Number(activeUser.count || activeUser.lastCount || 0);
                }

                renderUserCard();
                
                const updateRateMs = Number(channelsList.updateInterval) || 2000;

                liveUpdateTimer = setInterval(() => {
