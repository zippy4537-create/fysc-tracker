<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Leaderboard Hub</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ff4a4a;
            font-size: 36px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .search-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input[type="text"] {
            background-color: #1e1e1e;
            border: 2px solid #333;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            width: 300px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button.search-btn {
            background-color: #ff4a4a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.search-btn:hover {
            background-color: #e03e3e;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .channel-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            text-align: left;
        }
        .channel-card:hover {
            border-color: #ff4a4a;
        }
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff4a4a;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            background-color: #25273c;
        }
        .channel-name {
            font-size: 16px;
            font-weight: bold;
            word-break: break-word;
        }
        .sub-count-line {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 15px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: bold;
            display: block;
            font-size: 20px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            background-color: #121212;
            border: 1px solid #333;
            color: #ddd;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
        }
        .action-btn:hover {
            background-color: #222;
            color: white;
            border-color: #ff4a4a;
        }
        .admin-panel {
            margin-top: 60px;
            padding: 25px;
            background-color: #1e1e1e;
            border: 2px dashed #ff4a4a; /* Highly visible red dashed border */
            border-radius: 8px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-panel p {
            margin: 0 0 15px 0;
            font-weight: bold;
            color: #ff4a4a;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #121212;
            color: #ffffff;
            border: 2px solid #444; /* Solid background you can easily see and click */
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #ff4a4a;
        }
        .sync-btn {
            background-color: #ff4a4a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .sync-btn:hover {
            background-color: #e03e3e;
        }
        /* POPUP TRACKER WINDOW */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #ff4a4a;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .modal-counter {
            font-size: 48px;
            font-weight: bold;
            color: #ff4a4a;
            font-family: monospace;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>All FYSC Season 1 Channels</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>

        <div class="search-wrapper">
            <!-- Form prevents refresh on enter key -->
            <form id="searchForm" onsubmit="executeSearch(); return false;" style="display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Search channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div class="channels-grid" id="channelsGrid"></div>

        <!-- MODAL LIVE VIEWER -->
        <div class="modal-overlay" id="countModal">
            <div class="modal-box">
                <div id="modalRank" style="color:#aaaaaa; font-weight:bold; font-size:14px; margin-bottom:10px;">RANK #--</div>
                <img id="modalAvatar" src="" style="width:80px; height:80px; border-radius:50%; border:2px solid #ff4a4a; object-fit:cover; margin-bottom:15px; background-color:#121212;">
                <div class="modal-name" id="modalChannelName">Channel Name</div>
                <div style="font-size:12px; color:#aaaaaa; text-transform:uppercase; margin-top:15px;">Live Subscribers</div>
                <div class="modal-counter" id="modalCount">0</div>
                <button type="button" class="action-btn" style="width:100%; margin-top:10px; border-color:#ff4a4a;" id="closeModalBtn">Close Tracker</button>
            </div>
        </div>

        <!-- STRIPPED DOWN INPUT MANAGEMENT CONSOLE -->
        <div class="admin-panel">
            <p>STREAMER DATA PANEL</p>
            <textarea id="jsonPasteInput" placeholder="Paste your messy lcedit text block data string here..."></textarea>
            <br>
            <button type="button" class="sync-btn" id="syncBtn">Sync Channels Grid</button>
        </div>
    </div>

    <script>
        let masterChannelsList = [];
        let activeModalUser = null;

        // Automatically pulls stored channels if you refresh the website
        if (localStorage.getItem("fysc_stable_ledger")) {
            try {
                masterChannelsList = JSON.parse(localStorage.getItem("fysc_stable_ledger"));
                masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                buildDashboardGrid(masterChannelsList);
            } catch(e) { console.error(e); }
        }

        // Fixed click handling eliminates internal naming block errors
        document.getElementById("syncBtn").addEventListener("click", function() {
            const rawText = document.getElementById("jsonPasteInput").value.trim();
            if (!rawText) return alert("Please paste the data text block first!");
            try {
                const parsed = JSON.parse(rawText);
                const incoming = parsed.counters || parsed.data || parsed.channels || parsed;
                if (Array.isArray(incoming)) {
                    masterChannelsList = incoming;
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    localStorage.setItem("fysc_stable_ledger", JSON.stringify(masterChannelsList));
                    buildDashboardGrid(masterChannelsList);
                    
                    alert("Success! Loaded total tracked stream entries: " + masterChannelsList.length);
