<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Live Statistics Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .stat-line {
            font-size: 18px;
            margin: 8px 0;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Statistics</h1>
        <p class="subtitle">Search your channel to view your current standing</p>
        
        <input type="text" id="usernameInput" placeholder="Enter Username..." onkeyup="if(event.key === 'Enter') lookupUser()">
        <br>
        <button onclick="lookupUser()">Search User</button>
        
        <div class="result-box" id="resultArea">
            <p style="color: #777;">Results will appear here</p>
        </div>
    </div>

    <script>
        // ADD YOUR FAKE USER DATA HERE
        // Just follow the exact format below. Add as many as you need!
        const channelData = [
            { name: "UserA", rank: 51, subs: 125000 },
            { name: "UserB", rank: 52, subs: 124310 },
            { name: "StreamFan99", rank: 53, subs: 119000 },
            { name: "XyzGamer", rank: 54, subs: 95400 },
            { name: "PhysicsCool", rank: 105, subs: 1200 }
        ];

        function lookupUser() {
            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }
            
            // Look for the name in your data array
            const foundUser = channelData.find(user => user.name.toLowerCase() === searchInput);
            
            if (foundUser) {
                resultDiv.innerHTML = `
                    <div class="stat-line">Channel: <span class="highlight">${foundUser.name}</span></div>
                    <div class="stat-line">Rank: <span class="highlight">#${foundUser.rank}</span></div>
                    <div class="stat-line">Subscribers: <span class="highlight">${foundUser.subs.toLocaleString()}</span></div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <p style="color: #ff4a4a; font-weight: bold;">User not found!</p>
                    <p style="font-size: 14px; color: #aaa;">Make sure the spelling matches your stream registry.</p>
                `;
            }
        }
    </script>

</body>
</html>
