<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Live Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        .search-wrapper {
            position: relative;
            width: 85%;
            margin: 0 auto 15px auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #252525;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            text-align: left;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #ddd;
            font-size: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
        }
        .suggestion-item:hover {
            background-color: #ff4a4a;
            color: white;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <!-- The form submission now links straight to our tracking function -->
        <form onsubmit="startLiveTracking(); return false;">
            <div class="search-wrapper">
                <input type="text" id="usernameInput" placeholder="Enter Channel Name" autocomplete="off" oninput="handleInputDrawing()">
                <div class="suggestions-box" id="suggestionsBox"></div>
            </div>
            <button type="submit">Search Channel</button>
        </form>
        
        <div class="result-box" id="resultArea">
            <p style="color: #888; margin: 0;">Ready! Enter your channel name above.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // YOUR CHANNELS DIRECTORY
        // ==========================================
        let channelsList = [
            { "name": "GianlucaStatsV2", "count": 224880, "min_gain": 5, "max_gain": 15 },
            { "name": "MrDragonBeast", "count": 219689, "min_gain": 4, "max_gain": 12 },
            { "name": "BenGaming", "count": 196409, "min_gain": 3, "max_gain": 10 },
            { "name": "Dekyy722u", "count": 177622, "min_gain": 2, "max_gain": 8 },
            { "name": "ai ShowSpeed", "count": 128895, "min_gain": 1, "max_gain": 5 },
            { "name": "glm", "count": 21516, "min_gain": 1, "max_gain": 4 },
            { "name": "Oliwer maxi", "count": 29685, "min_gain": -2, "max_gain": 6 }
        ];

        let liveUpdateTimer = null;
        let activeUser = null;

        // Sort automatically right away
        channelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));

        function handleInputDrawing() {
            const inputVal = document.getElementById("usernameInput").value.trim().toLowerCase();
            const suggestionsBox = document.getElementById("suggestionsBox");
            
            if (inputVal === "") {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            const matches = channelsList.filter(user => {
                const name = (user.name || "").toString().toLowerCase();
                return name.includes(inputVal);
            }).slice(0, 6);

            if (matches.length === 0) {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            suggestionsBox.innerHTML = "";
            matches.forEach(user => {
                const item = document.createElement("div");
                item.className = "suggestion-item";
                item.innerHTML = `<span>${user.name}</span>`;
                
                item.onclick = function() {
                    document.getElementById("usernameInput").value = user.name;
                    suggestionsBox.innerHTML = "";
                    suggestionsBox.style.display = "none";
                    startLiveTracking();
                };
                suggestionsBox.appendChild(item);
            });

            suggestionsBox.style.display = "block";
        }

        document.addEventListener("click", function(e) {
            if (e.target.id !== "usernameInput") {
                document.getElementById("suggestionsBox").style.display = "none";
            }
        });

        function startLiveTracking() {
            // Close autocomplete box safely
            document.getElementById("suggestionsBox").style.display = "none";
            clearInterval(liveUpdateTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a; margin:0;'>Please enter a name to search.</p>";
                return;
            }

            activeUser = channelsList.find(user => {
                const currentName = (user.name || "").toString().trim().toLowerCase();
                return currentName === searchInput;
            });
            
            if (activeUser) {
                if (typeof activeUser.currentRunningCount === 'undefined' || isNaN(activeUser.currentRunningCount)) {
                    activeUser.currentRunningCount = Number(activeUser.count || 0);
                }

                renderUserCard();
                
                liveUpdateTimer = setInterval(() => {
                    executeLiveTick();
                }, 2000); 

            } else {
                resultDiv.innerHTML = `
                    <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                    <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure the spelling matches your user database listing exactly.</p>
                `;
            }
        }

        function renderUserCard() {
            const resultDiv = document.getElementById("resultArea");
            const displayCount = Math.floor(activeUser.currentRunningCount);
            
            const index = channelsList.indexOf(activeUser);
            const userRank = index !== -1 ? index + 1 : "Tracking";
            
            const userImage = "https://placeholder.com";

            resultDiv.innerHTML = `
                <img class="avatar" src="${userImage}" alt="Avatar">
                <div class="stat-line">Channel: <span style="font-weight:bold; color:white;">${activeUser.name}</span></div>
                <div class="stat-line">Rank: <span class="highlight">#${userRank}</span></div>
                <div class="stat-line">Subscribers: <span class="highlight" id="liveCounter">${displayCount.toLocaleString()}</span></div>
