<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Live Statistics - Realtime Sync Engine</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
            transition: color 0.15s ease-in-out;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <input type="text" id="usernameInput" placeholder="Enter Channel Name" onkeyup="if(event.key === 'Enter') startLiveTracking()">
        <br>
        <button onclick="startLiveTracking()">Search Channel</button>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Ready! Enter your channel name above.</p>
        </div>
    </div>

    <script>
        // Connected directly to your active lcedit dashboard cloud database
        const streamId = "81969dc3-7249-47f7-8554-8d0bb8c33800"; 

        let globalLiveTimer = null;
        let localTickerTimer = null;
        let activeUser = null;
        let updateRateMs = 2000; // Synchronized layout update interval timer rate (2000ms = 2s)

        async function startLiveTracking() {
            // Kill any active running interval execution loops on user re-submission
            clearInterval(globalLiveTimer);
            clearInterval(localTickerTimer);

            const searchInput = document.getElementById("usernameInput").value.trim();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }

            resultDiv.innerHTML = "<p>Connecting to lcedit cloud pipeline...</p>";

            // Fetch current baseline counts from cloud server immediately on execution
            await syncWithCloudDatabase(searchInput, true);

            // Keep cloud sync polling running every 15 seconds to catch new additions automatically
            globalLiveTimer = setInterval(async () => {
                await syncWithCloudDatabase(username, false);
            }, 15000);
        }

        async function syncWithCloudDatabase(username, isFirstLoad) {
            try {
                // Force a non-cached live endpoint fetch from livecountsedit cloud servers
                const response = await fetch(`https://lcedit.com{streamId}/?t=${Date.now()}`);
                const parsedData = await response.json();
                
                const channelsList = parsedData.data || parsedData.counters || [];
                const foundUser = channelsList.find(user => (user.name || "").trim().toLowerCase() === username.toLowerCase());
                
                if (foundUser) {
                    // Extract updateInterval values from lcedit JSON string to sync ticking speed
                    if (parsedData.updateInterval) {
                        updateRateMs = Number(parsedData.updateInterval);
                    }

                    const incomingCount = Math.floor(foundUser.count || foundUser.lastCount || 0);

                    if (isFirstLoad) {
                        activeUser = foundUser;
                        activeUser.currentRunningCount = incomingCount;
                        renderUserCard();
                        
                        // Begin the matching local odometer mathematical calculations loops
                        localTickerTimer = setInterval(() => {
                            executeOdometerTick();
                        }, updateRateMs);
                    } else {
                        // Smoothly calibrate the active running count to match the master cloud value if drifting occurs
                        if (Math.abs(activeUser.currentRunningCount - incomingCount) > 25) {
                            activeUser.currentRunningCount = incomingCount;
                        }
                        // Refresh non-count profile metadata details behind the scenes
                        activeUser.rank = foundUser.rank || (channelsList.indexOf(foundUser) + 1);
                        activeUser.image = foundUser.image;
                    }
                } else if (isFirstLoad) {
                    document.getElementById("resultArea").innerHTML = `
                        <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                        <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure they have joined via stream command registry.</p>
                    `;
                    clearInterval(globalLiveTimer);
                    clearInterval(localTickerTimer);
                }
            } catch (e) {
                console.error("Cloud tracking synchronization dropped:", e);
            }
        }

        function renderUserCard() {
            const resultDiv = document.getElementById("resultArea");
            const displayCount = Math.floor(activeUser.currentRunningCount);
            const userRank = activeUser.rank || "Tracking";
            const userImage = activeUser.image || "https://ggpht.com";

            resultDiv.innerHTML = `
                <img class="avatar" src="${userImage}" alt="Avatar">
                <div class="stat-line">Channel: <span style="font-weight:bold; color:white;">${activeUser.name}</span></div>
                <div class="stat-line">Rank: <span style="font-weight:bold; color:white;">#${userRank}</span></div>
                <div class="stat-line">Subscribers: <span class="highlight" id="liveCounter">${displayCount.toLocaleString()}</span></div>
                <div class="stat-line" style="font-size:12px; color:#148c50; margin-top:8px; display:flex; align-items:center; justify-content:center;">
                    <span class="live-indicator"></span> Synced 1:1 with lcedit Dashboard
                </div>
            `;
        }

        function executeOdometerTick() {
            if (!activeUser) return;

            // Extract the user's signature min_gain/max_gain parameters from your lcedit save profile
            const minGain = typeof activeUser.min_gain !== 'undefined' ? Number(activeUser.min_gain) : -3;
            const maxGain = typeof activeUser.max_gain !== 'undefined' ? Number(activeUser.max_gain) : 5;
            
            // Replicate the random algorithmic values generated on your master dashboard
            const change = Math.floor(Math.random() * (maxGain - minGain + 1)) + minGain;
            
            activeUser.currentRunningCount += change;

            const counterElement = document.getElementById("liveCounter");
            if (counterElement) {
                counterElement.innerText = Math.floor(activeUser.currentRunningCount).toLocaleString();
                
                // Trigger dynamic odometer layout color flashes
                if (change > 0) {
                    counterElement.style.color = "#148c50"; // Green for up-ticks
                } else if (change < 0) {
