<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Live Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        .search-wrapper {
            position: relative;
            width: 85%;
            margin: 0 auto 15px auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #252525;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            text-align: left;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #ddd;
            font-size: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
        }
        .suggestion-item:hover {
            background-color: #ff4a4a;
            color: white;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <!-- DIV element breaks the browser form submit page-refresh loop forever -->
        <div class="search-panel">
            <div class="search-wrapper">
                <input type="text" id="usernameInput" placeholder="Enter Channel Name" autocomplete="off" oninput="handleInputDrawing()" onkeydown="handleEnterKey(event)">
                <div class="suggestions-box" id="suggestionsBox"></div>
            </div>
            <button type="button" onclick="startLiveTracking()">Search Channel</button>
        </div>
        
        <div class="result-box" id="resultArea">
            <p style="color: #888; margin: 0;" id="statusMessage">Loading data directly from stream engine...</p>
        </div>
    </div>

    <script>
        // NO HARDCODED CHANNELS - Pulled completely live from lcedit
        let channelsList = [];
        let liveUpdateTimer = null;
        let activeUser = null;

        async function fetchLiveDatabase() {
            const msgText = document.getElementById("statusMessage");
            try {
                const targetUrl = 'https://lcedit.com';
                
                // AllOrigins proxy strips away browser headers blocking the lcedit link
                const response = await fetch('https://allorigins.win' + encodeURIComponent(targetUrl) + '&t=' + Date.now());
                if (!response.ok) throw new Error("Proxy error");
                
                const jsonWrapper = await response.json();
                const parsedData = JSON.parse(jsonWrapper.contents);
                
                // Livecountsedit wraps arrays in parsedData.data
                channelsList = parsedData.data || parsedData.channels || [];
                
                // Instantly align data descending so ranks are mathematically perfect
                channelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));

                if (msgText && msgText.textContent.includes("Loading data directly")) {
                    msgText.textContent = "Ready! Enter your channel name above.";
                }

                // If a channel is currently loaded, silently update its values in the background
                if (activeUser) {
                    const currentData = channelsList.find(u => u.name.toLowerCase() === activeUser.name.toLowerCase());
                    if (currentData) {
                        activeUser.count = currentData.count;
                        activeUser.min_gain = currentData.min_gain;
                        activeUser.max_gain = currentData.max_gain;
                        activeUser.image = currentData.image;
                    }
                }
            } catch (err) {
                console.error("Network read timeout loop conflict:", err);
                if (msgText && channelsList.length === 0) {
                    msgText.textContent = "Connecting error. Retrying...";
                }
            }
        }

        // Fetch everything immediately on launch
        fetchLiveDatabase();

        // Background loop triggers a quiet sync every 8 seconds to parse !add increments instantly
        setInterval(fetchLiveDatabase, 8000);

        function handleEnterKey(event) {
            if (event.key === "Enter") {
                startLiveTracking();
            }
        }

        function handleInputDrawing() {
            const inputVal = document.getElementById("usernameInput").value.trim().toLowerCase();
            const suggestionsBox = document.getElementById("suggestionsBox");
            
            if (inputVal === "") {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            // Filters matching items across ALL users inside your stream backend
            const matches = channelsList.filter(user => {
                const name = (user.name || "").toString().toLowerCase();
                return name.includes(inputVal);
            }).slice(0, 6);

            if (matches.length === 0) {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            suggestionsBox.innerHTML = "";
            matches.forEach(user => {
                const item = document.createElement("div");
                item.className = "suggestion-item";
                item.innerHTML = `<span>${user.name}</span>`;
                
                item.onclick = function() {
                    document.getElementById("usernameInput").value = user.name;
                    suggestionsBox.innerHTML = "";
                    suggestionsBox.style.display = "none";
                    startLiveTracking();
                };
                suggestionsBox.appendChild(item);
            });

            suggestionsBox.style.display = "block";
        }

        document.addEventListener("click", function(e) {
            if (e.target.id !== "usernameInput") {
                document.getElementById("suggestionsBox").style.display = "none";
            }
        });

        function startLiveTracking() {
            document.getElementById("suggestionsBox").style.display = "none";
            clearInterval(liveUpdateTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a; margin:0;'>Please enter a name to search.</p>";
                return;
            }

            if (channelsList.length === 0) {
                resultDiv.innerHTML = "<p style='color: #ff4a4a; margin:0;'>Database still loading. Wait a second...</p>";
                return;
            }
