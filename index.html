<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Realtime Sync</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <form onsubmit="handleFormSubmit(event)">
            <input type="text" id="usernameInput" placeholder="Enter Channel Name" autocomplete="off">
            <br>
            <button type="submit">Search Channel</button>
        </form>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Ready! Enter your channel name above.</p>
        </div>
    </div>

    <script>
        // Your exact livecountsedit dashboard cloud link ID
        const streamId = "81969dc3-7249-47f7-8554-8d0bb8c33800"; 

        let globalLiveTimer = null;
        let proxyIndex = 0;

        // A rotating list of secure CORS proxy streams to bypass server load limitations
        const proxies = [
            (url) => `https://corsproxy.io{encodeURIComponent(url)}`,
            (url) => `https://allorigins.win{encodeURIComponent(url)}`
        ];

        function handleFormSubmit(event) {
            event.preventDefault();
            startLiveTracking();
        }

        function startLiveTracking() {
            clearInterval(globalLiveTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }

            resultDiv.innerHTML = "<p>Connecting to lcedit cloud registry stream...</p>";

            // Fetch live data instantly on search execution
            fetchLiveCloudData(searchInput);

            // Keep pulling the data live every 2 seconds
            globalLiveTimer = setInterval(() => {
                fetchLiveCloudData(searchInput);
            }, 2000);
        }

        async function fetchLiveCloudData(username) {
            const resultDiv = document.getElementById("resultArea");
            const targetUrl = `https://lcedit.com{streamId}/?t=${Date.now()}`;
            
            // Build the current target URL utilizing our running rotating proxy stack
            const proxiedUrl = proxies[proxyIndex](targetUrl);

            try {
                const response = await fetch(proxiedUrl);
                let rawData = await response.json();
                
                // Normalizes the response schema differences across different proxies (AllOrigins wraps its data)
                let parsedData = rawData;
                if (rawData.contents && typeof rawData.contents === 'string') {
                    parsedData = JSON.parse(rawData.contents);
                }

                const channelsList = parsedData.data || parsedData.counters || [];
                
                const foundUser = channelsList.find(user => {
                    const currentName = (user.name || "").toString().trim().toLowerCase();
                    return currentName === username;
                });
                
                if (foundUser) {
                    const userSubs = Math.floor(foundUser.count || foundUser.lastCount || 0);
                    
                    let userRank = foundUser.rank;
                    if (!userRank) {
                        const index = channelsList.indexOf(foundUser);
                        userRank = index !== -1 ? index + 1 : "Tracking";
                    }
                    
                    const userImage = foundUser.image || "https://ggpht.com";

                    resultDiv.innerHTML = `
                        <img class="avatar" src="${userImage}" alt="Avatar">
                        <div class="stat-line">Channel: <span style="font-weight:bold; color:white;">${foundUser.name}</span></div>
                        <div class="stat-line">Rank: <span class="highlight">#${userRank}</span></div>
                        <div class="stat-line">Subscribers: <span class="highlight">${userSubs.toLocaleString()}</span></div>
                        <div class="stat-line" style="font-size:12px; color:#148c50; margin-top:8px; display:flex; align-items:center; justify-content:center;">
                            <span class="live-indicator"></span> Synced 1:1 with lcedit Dashboard
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                        <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure they have joined via stream command registry.</p>
                    `;
                }
            } catch (e) {
                console.warn("Proxy connection timed out or dropped. Cycling proxy network endpoints...", e);
                // Automatically cycle to the next backup proxy in the list on failure
                proxyIndex = (proxyIndex + 1) % proxies.length;
            }
        }
    </script>
</body>
</html>
