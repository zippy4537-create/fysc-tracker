<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 - Leaderboard Hub</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0b10 0%, #12131f 100%);
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #7d85b2;
            font-size: 15px;
            margin-bottom: 40px;
        }
        .search-box-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        input[type="text"] {
            background-color: #171826;
            border: 2px solid #25273c;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            width: 280px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button.search-btn {
            background-color: #ff4a4a;
            border: none;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        button.search-btn:hover {
            background-color: #e03e3e;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }
        .channel-card {
            background-color: #131422;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #202236;
            transition: transform 0.2s, border-color 0.2s;
        }
        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #ff4a4a;
        }
        .rank-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #171826;
            border: 2px solid #25273c;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
        }
        .sub-count-line {
            font-size: 12px;
            color: #8186a3;
            margin-bottom: 15px;
            border-top: 1px solid #1f2133;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: 800;
            display: block;
            font-size: 20px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            background-color: #171826;
            border: 1px solid #25273c;
            color: #cbd5e1;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }
        .action-btn:hover {
            background-color: #25273c;
            color: #ffffff;
        }
        .action-btn.primary-action {
            background-color: rgba(255, 74, 74, 0.08);
            border-color: rgba(255, 74, 74, 0.3);
            color: #ff7676;
        }
        .action-btn.primary-action:hover {
            background-color: #ff4a4a;
            color: #ffffff;
            border-color: #ff4a4a;
        }
        #statusMessage {
            font-size: 16px;
            color: #ff4a4a;
            font-weight: bold;
            margin-top: 20px;
        }
        /* POPUP MODAL ENGINE LAYERS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 5, 8, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #131422;
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #ff4a4a;
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .modal-counter {
            font-size: 48px;
            font-weight: 800;
            color: #ff4a4a;
            font-family: monospace;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Live Tracking Engine & Custom Leaderboard Hub</p>

        <div class="search-box-wrapper">
            <form id="searchForm" onsubmit="executeSearch(); return false;" style="display: flex; gap: 12px;">
                <input type="text" id="userInput" placeholder="Search channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div id="statusMessage">Connecting directly to stream registry...</div>
        <div class="channels-grid" id="channelsGrid"></div>

        <!-- STABLE POPUP COUNTER MODAL -->
        <div class="modal-overlay" id="countModal">
            <div class="modal-box">
                <div id="modalRank" style="color:#8fa0dd; font-weight:600; font-size:14px; margin-bottom:12px;">RANK #--</div>
                <img id="modalAvatar" src="" style="width:90px; height:90px; border-radius:50%; border:2px solid #ff4a4a; object-fit:cover; margin-bottom:15px; background-color:#171826;">
                <div class="modal-name" id="modalChannelName">Channel Name</div>
                <div style="font-size:12px; color:#8186a3; text-transform:uppercase; letter-spacing:1px; margin-top:15px;">Live Subscribers</div>
                <div class="modal-counter" id="modalCount">0</div>
                <button type="button" class="action-btn" style="width:100%; margin-top:10px; border-color:#ff4a4a; color:#ff7676;" id="closeModalBtn">Close Tracker</button>
            </div>
        </div>
    </div>

    <script>
        let masterChannelsList = [];
        let activeModalUser = null;
        const saveID = '82558b76-ff7e-1cd8-6b0b-a58ef0d8b020';

        // THE BYPASS UNLOCKED PAYLOAD ENGINE: Decodes lcedit API data properties natively
        window.lceditResponseHandler = function(payload) {
            const statusMessage = document.getElementById("statusMessage");
            try {
                const incomingData = payload.counters || payload.data || payload.channels || [];
                
                if (incomingData && incomingData.length > 0) {
                    masterChannelsList = incomingData;
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    if (statusMessage) statusMessage.style.display = "none";
                    buildDashboardGrid(masterChannelsList);
                }
            } catch (err) {
                console.error(err);
            }
        };

        function fetchLiveStreamData() {
            // Script element injection uses lcedit's staging routing endpoints to skip CORS firewalls completely
            const dynamicScript = document.createElement('script');
            dynamicScript.src = 'https://lcedit.com' + saveID + '?callback=lceditResponseHandler&t=' + Date.now();
            
            const existingScript = document.getElementById('lcedit-automation-bridge');
            if (existingScript) existingScript.remove();
            
            dynamicScript.id = 'lcedit-automation-bridge';
            document.body.appendChild(dynamicScript);
        }

        fetchLiveStreamData();
        // Quiet background loop checks for new !add channel entries automatically every 7 seconds
        setInterval(fetchLiveStreamData, 7000);

        function buildDashboardGrid(listToRender) {
