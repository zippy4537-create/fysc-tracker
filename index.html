<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All FYSC Season 1 Channels</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #ff4a4a;
            font-size: 36px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .search-wrapper {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input[type="text"] {
            background-color: #1e1e1e;
            border: 2px solid #333;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            width: 300px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button.search-btn {
            background-color: #ff4a4a;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .channel-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            text-align: left;
        }
        .channel-card:hover {
            border-color: #ff4a4a;
        }
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ff4a4a;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            background-color: #25273c;
        }
        .channel-name {
            font-size: 15px;
            font-weight: bold;
            word-break: break-word;
        }
        .sub-count-line {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 15px;
            border-top: 1px solid #333;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: bold;
            display: block;
            font-size: 20px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            background-color: #121212;
            border: 1px solid #333;
            color: #ddd;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
        }
        .action-btn:hover {
            border-color: #ff4a4a;
            color: white;
        }
        #statusMessage {
            font-size: 16px;
            color: #ff4a4a;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>All FYSC Season 1 Channels</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>

        <div class="search-wrapper">
            <!-- Fixed intercept form block handles enter keys instantly without crashing -->
            <form id="searchForm" onsubmit="executeSearch(); return false;" style="display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Search channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div id="statusMessage">Syncing live database stream entries...</div>
        <div class="channels-grid" id="channelsGrid"></div>
    </div>

    <script>
        let masterChannelsList = [];
        const saveID = '82558b76-ff7e-1cd8-6b0b-a58ef0d8b020';

        // THE CONNECTION LOOP BYPASS: Safely decodes incoming payload logs natively inside the browser context
        window.processTnStatsFeed = function(payload) {
            const statusMessage = document.getElementById("statusMessage");
            try {
                // Collect entries inside 'counters' matching the tnstats backend structural object keys
                const data = payload.counters || payload.data || payload.channels || [];
                if (data && data.length > 0) {
                    masterChannelsList = data;
                    
                    // Sort descending automatically so rank positions re-calculate dynamically on the fly
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    if (statusMessage) statusMessage.style.display = "none";
                    buildDashboardGrid(masterChannelsList);
                }
            } catch (err) {
                console.error("Format parsing error:", err);
            }
        };

        function fetchLiveStreamData() {
            const dynamicScript = document.createElement('script');
            // FIX: Pointing straight to tnstats' custom server script bridge which completely drops cross-origin blocks
            dynamicScript.src = 'https://tnstats.dev' + saveID + '?callback=processTnStatsFeed&t=' + Date.now();
            
            const oldScript = document.getElementById('lcedit-automation-bridge');
            if (oldScript) oldScript.remove();
            
            dynamicScript.id = 'lcedit-automation-bridge';
            document.body.appendChild(dynamicScript);
        }

        // Fetch data immediately upon initial website load
        fetchLiveStreamData();

        // Checked every 5 seconds to update entries seamlessly as soon as new users do !add
        setInterval(fetchLiveStreamData, 5000);

        function buildDashboardGrid(listToRender) {
            const grid = document.getElementById("channelsGrid");
            grid.innerHTML = "";

            listToRender.forEach(user => {
                const trueRank = masterChannelsList.indexOf(user) + 1;
                const currentCount = Math.floor(Number(user.count || 0));
                
                // Pull avatar image link from the payload variable or fallback to standard system avatar template
                const avatarImg = user.image || "https://lcedit.com";

                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="rank-badge">#${trueRank}</div>
                    <div class="card-header">
                        <img class="avatar" src="${avatarImg}"><span class="channel-name">${user.name}</span>
                    </div>
                    <div class="sub-count-line">
                        Subscribers: <span class="sub-number" id="card-count-${trueRank}">${currentCount.toLocaleString()}</span>
                    </div>
                    <div class="card-actions">
                        <!-- BUTTON ENGINE FOR WORKING LIVE MODAL WINDOW LOOKUPS -->
                        <a class="action-btn" href="https://tnstats.dev{encodeURIComponent(user.id || 'UCt_yPcT2JiSM0PMAwiyUzGw')}" target="_blank" style="color: #ff4a4a;">Live Subcount</a>
                        <a class="action-btn" href="https://youtube.com{encodeURIComponent(user.name)}" target="_blank">Go to Channel</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function executeSearch() {
            const query = document.getElementById("userInput").value.trim().toLowerCase();
            if (query === "") {
                buildDashboardGrid(masterChannelsList);
                return;
            }
            const filtered = masterChannelsList.filter(user => 
                (user.name || "").toString().toLowerCase().includes(query)
            );
            buildDashboardGrid(filtered);
        }

        document.getElementById("userInput").addEventListener("input", executeSearch);
    </script>
</body>
</html>
