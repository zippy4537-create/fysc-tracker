<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Hub</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #0d0e15 0%, #151624 100%);
            color: #ffffff;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #8fa0dd;
            font-size: 15px;
            margin-bottom: 40px;
        }
        .search-container {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        input[type="text"] {
            background-color: #1c1d30;
            border: 2px solid #2d2f4a;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            width: 280px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button.search-btn {
            background-color: #ff4a4a;
            border: none;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background-color: #161726;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #25273c;
        }
        .rank-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2d2f4a;
            background-color: #25273c;
        }
        .channel-name {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }
        .sub-count-line {
            font-size: 12px;
            color: #8e92a7;
            margin-bottom: 15px;
            border-top: 1px solid #25273c;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: 800;
            display: block;
            font-size: 18px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            background-color: #1c1d30;
            border: 1px solid #2d2f4a;
            color: #cbd5e1;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }
        .admin-panel {
            margin-top: 80px;
            padding: 20px;
            background-color: #11121e;
            border-radius: 12px;
            border: 1px dashed #2d2f4a;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        textarea {
            width: 100%;
            height: 80px;
            background-color: #1c1d30;
            color: #ffffff;
            border: 1px solid #2d2f4a;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }
        .sync-btn {
            background-color: #2d2f4a;
            border: none;
            color: #ffffff;
            padding: 8px 25px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>FYSC Season 1</h1>
    <p class="subtitle">Live Leaderboard Ecosystem & Channel Standing Analyzer</p>

    <div class="search-container">
        <!-- Pure form logic intercepts enter presses seamlessly -->
        <form id="searchForm" onsubmit="filterChannels(); return false;">
            <input type="text" id="userInput" placeholder="Search channel name...">
            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>

    <div class="channels-grid" id="channelsGrid"></div>

    <div class="admin-panel">
        <p>Streamer System Controller (Paste fresh lcedit data code logs here to update numbers on stream)</p>
        <textarea id="jsonPasteInput" placeholder="Paste updated text string here..."></textarea>
        <button type="button" class="sync-btn" id="syncBtn" onclick="syncDatabaseManual()">Sync Live Ledger</button>
    </div>

    <script>
        let masterChannelsList = [];

        // Instantly verify storage cache entries to bypass white load frames
        if (localStorage.getItem("fysc_clean_grid_v9")) {
            try {
                masterChannelsList = JSON.parse(localStorage.getItem("fysc_clean_grid_v9"));
                masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                renderGridHTML(masterChannelsList);
            } catch(e) { console.error(e); }
        }

        function syncDatabaseManual() {
            const rawText = document.getElementById("jsonPasteInput").value.trim();
            if (!rawText) return alert("Please paste the data text block first!");
            try {
                const parsed = JSON.parse(rawText);
                const incoming = parsed.counters || parsed.data || parsed.channels || parsed;
                if (Array.isArray(incoming)) {
                    masterChannelsList = incoming;
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    localStorage.setItem("fysc_clean_grid_v9", JSON.stringify(masterChannelsList));
                    renderGridHTML(masterChannelsList);
                    alert("Dashboard interface synchronized successfully!");
                    document.getElementById("jsonPasteInput").value = "";
                } else {
                    alert("Data format error inside pasted content wrapper.");
                }
            } catch (err) { alert("Parse string error block verification loop."); }
        }

        function renderGridHTML(listToRender) {
            const grid = document.getElementById("channelsGrid");
            grid.innerHTML = "";

            listToRender.forEach(user => {
                const trueRank = masterChannelsList.indexOf(user) + 1;
                const currentCount = Math.floor(Number(user.count || 0));
                const avatarImg = user.image || "https://placeholder.com";

                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="rank-badge">RANK #${trueRank}</div>
                    <div class="card-header">
                        <img class="avatar" src="${avatarImg}">
                        <span class="channel-name">${user.name}</span>
                    </div>
                    <div class="sub-count-line">
                        Subscribers:
                        <span class="sub-number" id="card-count-${trueRank}">${currentCount.toLocaleString()}</span>
                    </div>
                    <div class="card-actions">
                        <a class="action-btn" href="https://youtube.com{encodeURIComponent(user.name)}" target="_blank">Go to Channel</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Active ticker odometer emulation flutters values smoothly every 2 seconds
        setInterval(function() {
            if (masterChannelsList.length === 0) return;
            masterChannelsList.forEach((user, index) => {
                const minGain = typeof user.min_gain !== 'undefined' ? Number(user.min_gain) : -1;
                const maxGain = typeof user.max_gain !== 'undefined' ? Number(user.max_gain) : 3;
                const fluctuation = Math.random() * (maxGain - minGain) + minGain;
                
                if (typeof user.currentRunningCount === 'undefined' || isNaN(user.currentRunningCount)) {
                    user.currentRunningCount = Number(user.count || 0);
                }
                user.currentRunningCount = Math.max(0, user.currentRunningCount + fluctuation);
