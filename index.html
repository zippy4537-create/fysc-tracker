<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing</p>
        
        <input type="text" id="usernameInput" placeholder="Search User" onkeyup="if(event.key === 'Enter') lookupUser()">
        <br>
        <button onclick="lookupUser()">Search</button>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Loading dashboard data...</p>
        </div>
    </div>

    <script>
        let channelsList = [];

        // This connects directly to your separate data.json file
        async function loadData() {
            const resultDiv = document.getElementById("resultArea");
            try {
                const response = await fetch('data.json');
                const parsedData = await response.json();
                
                // Read from the lcedit structured array
                channelsList = parsedData.data || parsedData.counters || [];
                resultDiv.innerHTML = `<p style="color: #888; margin: 0;">Ready! Enter your channel name above.</p>`;
            } catch (e) {
                console.error("Failed to load data.json:", e);
                resultDiv.innerHTML = `<p style="color: #ff4a4a; margin: 0;">Error: Could not link to data.json file.</p>`;
            }
        }

        // Run data sync immediately
        loadData();

        function lookupUser() {
            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }
            
            if (channelsList.length === 0) {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Data is still loading or empty. Please wait a second.</p>";
                return;
            }

            const foundUser = channelsList.find(user => (user.name || "").trim().toLowerCase() === searchInput);
            
            if (foundUser) {
                const userSubs = Math.floor(foundUser.count || foundUser.lastCount || 0);
                const userImage = foundUser.image || "https://ggpht.com";

                resultDiv.innerHTML = `
                    <img class="avatar" src="${userImage}" alt="Avatar">
                    <div class="stat-line">Channel: <span class="highlight">${foundUser.name}</span></div>
                    <div class="stat-line">Subscribers: <span class="highlight">${userSubs.toLocaleString()}</span></div>
                    <div class="stat-line" style="font-size:12px; color:#555; margin-top:8px;">Connected Live via lcedit</div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                    <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure the spelling matches your stream registry layout exactly.</p>
                `;
            }
        }
    </script>
</body>
</html>
