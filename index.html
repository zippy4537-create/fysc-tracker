<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Leaderboard Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }
        h1 {
            color: #ff0000;
            margin-bottom: 5px;
            font-size: 32px;
            font-weight: bold;
        }
        .subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-panel {
            position: relative;
            width: 90%;
            margin: 0 auto;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #2b2a2a;
            color: white;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #ff0000;
        }
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #252525;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
            text-align: left;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        }
        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            color: #ddd;
            font-size: 15px;
            border-bottom: 1px solid #333;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background-color: #ff0000;
            color: white;
        }
        .search-btn {
            margin-top: 15px;
            padding: 12px 35px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .search-btn:hover {
            background-color: #cc0000;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #151515;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #252525;
        }
        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff0000;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff0000;
            font-weight: bold;
            font-size: 34px;
            letter-spacing: -1px;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .streamer-tools {
            margin-top: 40px;
            padding: 15px;
            background: #151515;
            border-radius: 8px;
            border: 1px dashed #333;
        }
        .streamer-tools p {
            font-size: 12px;
            margin: 0 0 10px 0;
            color: #888;
        }
        textarea {
            width: 100%;
            height: 60px;
            background: #252525;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            outline: none;
        }
        textarea:focus {
            border-color: #ff0000;
        }
        .sync-btn {
            background-color: #333;
            color: #aaa;
            border: 1px solid #444;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }
        .sync-btn:hover {
            background-color: #444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing live</p>
        
        <!-- form tag with return false strictly stops page refreshes -->
        <form onsubmit="executeChannelSearch(); return false;">
            <div class="search-panel">
                <input type="text" id="usernameInput" placeholder="Enter Channel Name" autocomplete="off" oninput="showLiveSuggestions()">
                <div class="suggestions-box" id="suggestionsBox"></div>
            </div>
            <button type="submit" class="search-btn">Search Channel</button>
        </form>
        
        <div class="result-box" id="resultArea">
            <p style="color: #888; margin: 0;" id="mainStatusText">Ready! Update your channel list below.</p>
        </div>

        <div class="streamer-tools">
            <p>Streamer Sync Tool (Paste your raw lcedit API text below)</p>
            <textarea id="jsonPasteBox" placeholder="Paste text here..."></textarea>
            <button type="button" class="sync-btn" onclick="processDatabaseSync()">Sync Leaderboard</button>
        </div>
    </div>

    <script>
        let fullChannelsData = [];
        let liveTickerTimer = null;
        let selectedChannel = null;

        // Automatically load saved database from browser storage if page refreshes
        if (localStorage.getItem("fysc_saved_database")) {
            try {
                fullChannelsData = JSON.parse(localStorage.getItem("fysc_saved_database"));
                fullChannelsData.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                refreshStatusBanner();
            } catch(e) {}
        }

        function refreshStatusBanner() {
            document.getElementById("mainStatusText").textContent = "Database active! Loaded " + fullChannelsData.length + " total channels.";
        }

        function processDatabaseSync() {
            const pastedInput = document.getElementById("jsonPasteBox").value.trim();
            if (!pastedInput) return alert("Please paste the data text block first!");

            try {
                const parsedJSON = JSON.parse(pastedInput);
                const arrayPayload = parsedJSON.data || parsedJSON.channels || parsedJSON.counters || parsedJSON;
                
                if (Array.isArray(arrayPayload)) {
                    fullChannelsData = arrayPayload;
                    // Sort descending immediately to make ranks perfect
                    fullChannelsData.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    // Save into browser history cache
                    localStorage.setItem("fysc_saved_database", JSON.stringify(fullChannelsData));
                    refreshStatusBanner();
                    
                    alert("Leaderboard updated! " + fullChannelsData.length + " channels are now searchable.");
                    document.getElementById("jsonPasteBox").value = "";
                } else {
                    alert("Invalid data structure. Make sure you copied the whole text wall.");
                }
            } catch (err) {
                alert("JSON Parse Error: Make sure you copied the text correctly.");
            }
        }

        function showLiveSuggestions() {
            const inputVal = document.getElementById("usernameInput").value.trim().toLowerCase();
            const suggestionsBox = document.getElementById("suggestionsBox");
            
            if (inputVal === "") {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            const matchingResults = fullChannelsData.filter(user => {
                const channelName = (user.name || "").toString().toLowerCase();
                return channelName.includes(inputVal);
            }).slice(0, 6);

            if (matchingResults.length === 0) {
                suggestionsBox.innerHTML = "";
                suggestionsBox.style.display = "none";
                return;
            }

            suggestionsBox.innerHTML = "";
            matchingResults.forEach(user => {
                const divItem = document.createElement("div");
                divItem.className = "suggestion-item";
                divItem.innerHTML = `<span>${user.name}</span>`;
                
                divItem.onclick = function() {
                    document.getElementById("usernameInput").value = user.name;
                    suggestionsBox.innerHTML = "";
                    suggestionsBox.style.display = "none";
                    executeChannelSearch();
                };
