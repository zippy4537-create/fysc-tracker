<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 - Leaderboard Hub</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        /* LUXURY NEON DARK SPACE THEME */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a0b10 0%, #12131f 100%);
            color: #ffffff;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
            min-height: 100vh;
        }
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 46px;
            font-weight: 800;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #7d85b2;
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .search-box-wrapper {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        input[type="text"] {
            background-color: #171826;
            border: 2px solid #25273c;
            color: #ffffff;
            padding: 14px 20px;
            font-size: 15px;
            border-radius: 10px;
            width: 300px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
            box-shadow: 0 0 15px rgba(255, 74, 74, 0.2);
        }
        button.search-btn {
            background-color: #ff4a4a;
            border: none;
            color: #ffffff;
            padding: 14px 35px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s ease;
        }
        button.search-btn:hover {
            background-color: #e03e3e;
            transform: translateY(-2px);
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .channel-card {
            background-color: #131422;
            border-radius: 16px;
            padding: 24px;
            position: relative;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #202236;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #ff4a4a;
            box-shadow: 0 15px 30px rgba(255, 74, 74, 0.15);
        }
        .rank-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(255, 74, 74, 0.3);
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 20px;
            gap: 14px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #171826;
            border: 2px solid #25273c;
        }
        .channel-name {
            font-size: 16px;
            font-weight: 600;
            word-break: break-word;
            line-height: 1.3;
        }
        .sub-count-line {
            font-size: 13px;
            color: #8186a3;
            margin-bottom: 20px;
            border-top: 1px solid #1f2133;
            padding-top: 16px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: 800;
            display: block;
            font-size: 22px;
            margin-top: 4px;
            font-family: monospace;
            letter-spacing: -0.5px;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .action-btn {
            background-color: #171826;
            border: 1px solid #25273c;
            color: #cbd5e1;
            padding: 12px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            background-color: #25273c;
            color: #ffffff;
            border-color: #383b5c;
        }
        .action-btn.primary-action {
            background-color: rgba(255, 74, 74, 0.08);
            border-color: rgba(255, 74, 74, 0.3);
            color: #ff7676;
        }
        .action-btn.primary-action:hover {
            background-color: #ff4a4a;
            color: #ffffff;
            border-color: #ff4a4a;
        }
        .admin-panel {
            margin-top: 100px;
            padding: 25px;
            background-color: #0b0c12;
            border-radius: 14px;
            border: 1px dashed #25273c;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .admin-panel p {
            font-size: 13px;
            margin: 0 0 15px 0;
            color: #7d85b2;
        }
        textarea {
            width: 100%;
            height: 90px;
            background-color: #171826;
            color: #ffffff;
            border: 1px solid #25273c;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            margin-bottom: 15px;
        }
        .sync-btn {
            background-color: #25273c;
            border: none;
            color: #ffffff;
            padding: 10px 30px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }
        .sync-btn:hover {
            background-color: #333654;
        }
        /* POPUP MODAL ENGINE LAYERS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(4, 5, 8, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #131422;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #ff4a4a;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(255, 74, 74, 0.2);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-name {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .modal-counter {
            font-size: 54px;
            font-weight: 800;
            color: #ff4a4a;
            font-family: monospace;
            margin: 25px 0;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Live Tracking Engine & Custom Leaderboard Hub</p>

        <div class="search-box-wrapper">
            <form id="searchForm" onsubmit="executeSearch(); return false;" style="display: flex; gap: 12px;">
                <input type="text" id="userInput" placeholder="Search channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div class="channels-grid" id="channelsGrid"></div>

        <!-- STABLE POPUP COUNTER MODAL -->
        <div class="modal-overlay" id="countModal">
            <div class="modal-box">
                <div id="modalRank" style="color:#8fa0dd; font-weight:600; font-size:14px; margin-bottom:12px;">RANK #--</div>
                <img id="modalAvatar" src="" style="width:90px; height:90px; border-radius:50%; border:2px solid #ff4a4a; object-fit:cover; margin-bottom:15px; background-color:#171826;">
                <div class="modal-name" id="modalChannelName">Channel Name</div>
                <div style="font-size:12px; color:#8186a3; text-transform:uppercase; letter-spacing:1px; margin-top:15px;">Live Subscribers</div>
                <div class="modal-counter" id="modalCount">0</div>
                <button type="button" class="action-btn" style="width:100%; margin-top:10px; border-color:#ff4a4a; color:#ff7676;" id="closeModalBtn">Close Tracker</button>
            </div>
        </div>

        <!-- DATA UPDATE CONTROL PANEL -->
        <div class="admin-panel">
