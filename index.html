<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Channels - Live Tracker</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ff4a4a;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 85%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #ff4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e03e3e;
        }
        .result-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            background-color: #252525;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 2px solid #ff4a4a;
        }
        .stat-line {
            font-size: 18px;
            margin: 6px 0;
            color: #ddd;
        }
        .highlight {
            color: #ff4a4a;
            font-weight: bold;
            font-size: 32px;
            transition: color 0.15s ease-in-out;
        }
        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #148c50;
            border-radius: 50%;
            margin-right: 6px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your standing</p>
        
        <input type="text" id="usernameInput" placeholder="Search User" onkeyup="if(event.key === 'Enter') lookupUser()">
        <br>
        <button onclick="lookupUser()">Search</button>
        
        <div class="result-box" id="resultArea">
            <p style="color: #666; margin: 0;">Loading dashboard data...</p>
        </div>
    </div>

    <script>
        let channelsList = [];
        let liveUpdateTimer = null;
        let activeUser = null;

        // Force a live, non-cached fetch of data.json
        async function loadData() {
            const resultDiv = document.getElementById("resultArea");
            try {
                // Using a timestamp prevents the browser or GitHub from caching old numbers
                const response = await fetch('data.json?t=' + Date.now());
                const parsedData = await response.json();
                
                // Properly parse lcedit configuration array formats
                channelsList = parsedData.data || parsedData.counters || [];
                resultDiv.innerHTML = `<p style="color: #888; margin: 0;">Ready! Enter your channel name above.</p>`;
            } catch (e) {
                console.error("Failed to fetch current data.json:", e);
                resultDiv.innerHTML = `<p style="color: #ff4a4a; margin: 0;">Error syncing with master configuration.</p>`;
            }
        }

        // Run data load instantly
        loadData();

        function lookupUser() {
            // Kill any live ticker loop running from a old search query
            clearInterval(liveUpdateTimer);

            const searchInput = document.getElementById("usernameInput").value.trim().toLowerCase();
            const resultDiv = document.getElementById("resultArea");
            
            if (searchInput === "") {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Please enter a name to search.</p>";
                return;
            }
            
            if (channelsList.length === 0) {
                resultDiv.innerHTML = "<p style='color: #ff4a4a;'>Data is still loading or empty. Please wait a second.</p>";
                return;
            }

            activeUser = channelsList.find(user => (user.name || "").trim().toLowerCase() === searchInput);
            
            if (activeUser) {
                // Ensure internal data structures map variables to active states correctly
                if (typeof activeUser.count === 'undefined' && typeof activeUser.lastCount !== 'undefined') {
                    activeUser.count = Number(activeUser.lastCount);
                }

                renderUserCard();
                
                // LIVE TICKER CORE LOOP: Ticks exactly like lcedit on your stream
                liveUpdateTimer = setInterval(() => {
                    executeLiveTick();
                }, 2000); 

            } else {
                resultDiv.innerHTML = `
                    <p style="color: #ff4a4a; font-weight: bold; margin: 0 0 10px 0;">User not found!</p>
                    <p style="font-size: 14px; color: #aaa; margin: 0;">Make sure the spelling matches your stream registry layout exactly.</p>
                `;
            }
        }

        function renderUserCard() {
            const resultDiv = document.getElementById("resultArea");
            const displayCount = Math.floor(activeUser.count || 0);
            const userImage = activeUser.image || "https://ggpht.com";

            resultDiv.innerHTML = `
                <img class="avatar" src="${userImage}" alt="Avatar">
                <div class="stat-line">Channel: <span style="font-weight:bold; color:white;">${activeUser.name}</span></div>
                <div class="stat-line">Subscribers: <span class="highlight" id="liveCounter">${displayCount.toLocaleString()}</span></div>
                <div class="stat-line" style="font-size:12px; color:#148c50; margin-top:8px; display:flex; align-items:center; justify-content:center;">
                    <span class="live-indicator"></span> Tracking Live Stream Data
                </div>
            `;
        }

        function executeLiveTick() {
            if (!activeUser) return;

            // Read the gain parameters directly out of your lcedit master save file
            const minGain = typeof activeUser.min_gain !== 'undefined' ? Number(activeUser.min_gain) : -3;
            const maxGain = typeof activeUser.max_gain !== 'undefined' ? Number(activeUser.max_gain) : 5;
            
            // Random fluctuation based on your exact layout rate settings
            const change = Math.floor(Math.random() * (maxGain - minGain + 1)) + minGain;
            
            activeUser.count = (Number(activeUser.count) || 0) + change;
            if (activeUser.lastCount) activeUser.lastCount = activeUser.count;

            const counterElement = document.getElementById("liveCounter");
            if (counterElement) {
                counterElement.innerText = Math.floor(activeUser.count).toLocaleString();
                
                // Color updates mimic odometer colors matching lcedit theme styles
                if (change > 0) {
                    counterElement.style.color = "#148c50"; // Green for positive gain
                } else if (change < 0) {
                    counterElement.style.color = "#b43c3c"; // Red for negative drop
                }
                
                // Smoothly switch colors back to your primary theme layout red
                setTimeout(() => {
                    counterElement.style.color = "#ff4a4a";
                }, 350);
            }
        }
    </script>
</body>
</html>
