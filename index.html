<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 - Check Your Rank</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: #ff4a4a; font-size: 32px; margin-bottom: 5px; }
        .subtitle { color: #aaaaaa; margin-bottom: 30px; font-size: 16px; }
        .search-wrapper { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; }
        input[type="text"] {
            background-color: #1e1e1e; border: 2px solid #333; color: white;
            padding: 12px 20px; font-size: 16px; border-radius: 6px; width: 250px; outline: none;
        }
        input[type="text"]:focus { border-color: #ff4a4a; }
        button.search-btn {
            background-color: #ff4a4a; color: white; border: none; padding: 12px 30px;
            font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .result-card {
            background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px;
            padding: 25px; display: none;
        }
        .result-card.visible { display: block; }
        .result-name { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #333; }
        .result-label { color: #aaa; }
        .result-value { font-weight: bold; font-family: monospace; font-size: 18px; }
        #statusMessage { font-size: 15px; color: #aaa; margin-top: 15px; }
        #statusMessage.error { color: #ff4a4a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FYSC Season 1</h1>
        <p class="subtitle">Search your channel name to check your live rank & count</p>

        <div class="search-wrapper">
            <form id="searchForm" onsubmit="doSearch(); return false;" style="display: flex; gap: 10px;">
                <input type="text" id="userInput" placeholder="Your channel name..." autocomplete="off">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-name" id="resultName"></div>
            <div class="result-row"><span class="result-label">Rank</span><span class="result-value" id="resultRank"></span></div>
            <div class="result-row"><span class="result-label">Subscribers</span><span class="result-value" id="resultCount"></span></div>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script>
        // ---- CONFIGURE THIS: your Cloudflare Worker URL after deployment ----
        const WORKER_URL = "https://deploy.zippy4537.workers.dev";
        // -----------------------------------------------------------------------

        async function doSearch() {
            const name = document.getElementById("userInput").value.trim();
            const statusEl = document.getElementById("statusMessage");
            const cardEl = document.getElementById("resultCard");
            statusEl.className = "";
            cardEl.classList.remove("visible");

            if (!name) {
                statusEl.textContent = "Type your channel name above.";
                return;
            }

            statusEl.textContent = "Looking up...";

            try {
                const res = await fetch(`${WORKER_URL}/lookup?name=${encodeURIComponent(name)}`);
                const data = await res.json();

                if (data.error === "not_found") {
                    statusEl.className = "error";
                    statusEl.textContent = "We don't have you yet — type !add in chat first, then search again.";
                    return;
                }
                if (data.error) {
                    statusEl.className = "error";
                    statusEl.textContent = "Something went wrong, try again in a moment.";
                    return;
                }

                document.getElementById("resultName").textContent = data.name;
                document.getElementById("resultRank").textContent = data.rank ? "#" + data.rank : (data.rawRank || "?");
                document.getElementById("resultCount").textContent = data.count || data.rawSubs || "?";
                cardEl.classList.add("visible");
                statusEl.textContent = "";
            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = "Couldn't reach the tracker — try again in a moment.";
            }
        }
    </script>
</body>
</html>
