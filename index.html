<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYSC Season 1 Hub</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        /* BRAND NEW UNIQUE VISUAL INTERFACE STYLE */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d0e15 0%, #151624 100%);
            color: #ffffff;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #8fa0dd;
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .search-container {
            margin-bottom: 50px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        input[type="text"] {
            background-color: #1c1d30;
            border: 2px solid #2d2f4a;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            width: 280px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }
        input[type="text"]:focus {
            border-color: #ff4a4a;
            box-shadow: 0 0 10px rgba(255, 74, 74, 0.2);
        }
        button.search-btn {
            background-color: #ff4a4a;
            border: none;
            color: #ffffff;
            padding: 12px 30px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s;
        }
        button.search-btn:hover {
            background-color: #e03e3e;
            transform: translateY(-1px);
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background-color: #161726;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #25273c;
            transition: all 0.2s ease-in-out;
        }
        .channel-card:hover {
            transform: translateY(-4px);
            border-color: #ff4a4a;
            box-shadow: 0 12px 25px rgba(255, 74, 74, 0.15);
        }
        .rank-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(45deg, #ff4a4a, #ff7676);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(255, 74, 74, 0.3);
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
            gap: 12px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #25273c;
            border: 2px solid #2d2f4a;
        }
        .channel-name {
            font-size: 15px;
            font-weight: 600;
            word-break: break-word;
            color: #ffffff;
        }
        .sub-count-line {
            font-size: 12px;
            color: #8e92a7;
            margin-bottom: 20px;
            border-top: 1px solid #25273c;
            padding-top: 12px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: 800;
            display: block;
            font-size: 18px;
            margin-top: 2px;
            font-family: monospace;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .action-btn {
            background-color: #1c1d30;
            border: 1px solid #2d2f4a;
            color: #cbd5e1;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            transition: all 0.15s;
        }
        .action-btn:hover {
            background-color: #2d2f4a;
            color: #ffffff;
            border-color: #474b75;
        }
        .action-btn.primary-action {
            background-color: rgba(255, 74, 74, 0.1);
            border-color: rgba(255, 74, 74, 0.4);
            color: #ff7676;
        }
        .action-btn.primary-action:hover {
            background-color: #ff4a4a;
            color: #ffffff;
            border-color: #ff4a4a;
        }
        .admin-panel {
            margin-top: 80px;
            padding: 20px;
            background-color: #11121e;
            border-radius: 12px;
            border: 1px dashed #2d2f4a;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        textarea {
            width: 100%;
            height: 80px;
            background-color: #1c1d30;
            color: #ffffff;
            border: 1px solid #2d2f4a;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }
        .sync-btn {
            background-color: #2d2f4a;
            border: none;
            color: #ffffff;
            padding: 8px 25px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }
        .sync-btn:hover {
            background-color: #3d416e;
        }
        /* POPUP CONTAINER STYLING */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: #161726;
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #ff4a4a;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(255, 74, 74, 0.2);
            transform: scale(0.8);
            transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }
        .modal-name {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        .modal-counter {
            font-size: 48px;
            font-weight: 800;
            color: #ff4a4a;
            font-family: monospace;
            margin: 20px 0;
            letter-spacing: -1px;
        }
    </style>
</head>

    <div class="channels-grid" id="channelsGrid"></div>

            <img id="modalAvatar" src="" style="width:80px; height:80px; border-radius:50%; border:2px solid #ff4a4a; object-fit:cover; margin-bottom:15px;">
            <div class="modal-name" id="modalChannelName">Channel Name</div>
            <div style="font-size:12px; color:#8e92a7; text-transform:uppercase; letter-spacing:1px; margin-top:15px;">Live Subscribers</div>

            <button class="action-btn" style="width:100%; margin-top:10px;" onclick="closeLiveCounter()">Close Tracker</button>

    </div>
