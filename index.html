<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All FYSC Season 1 Channels</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222222;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }
        .search-container {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        input[type="text"] {
            background-color: #1a242d;
            border: 1px solid #3ca4a6;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            width: 250px;
            outline: none;
        }
        button.search-btn {
            background-color: #1a242d;
            border: 1px solid #3ca4a6;
            color: #3ca4a6;
            padding: 10px 25px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button.search-btn:hover {
            background-color: #3ca4a6;
            color: #1a242d;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .channel-card {
            background-color: #2d2d2d;
            border-radius: 6px;
            padding: 15px;
            position: relative;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #3d3d3d;
        }
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #00bcd4;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .card-header {
            display: flex;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 15px;
            gap: 10px;
        }
        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #444;
        }
        .channel-name {
            font-size: 14px;
            font-weight: bold;
            word-break: break-word;
            color: #ffffff;
        }
        .sub-count-line {
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 15px;
        }
        .sub-number {
            color: #ffffff;
            font-weight: bold;
            display: block;
            font-size: 15px;
            margin-top: 2px;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-btn {
            background-color: #1a242d;
            border: 1px solid #3ca4a6;
            color: #3ca4a6;
            padding: 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            transition: 0.15s;
        }
        .action-btn:hover {
            background-color: #3ca4a6;
            color: #1a242d;
        }
        #statusMessage {
            font-size: 16px;
            color: #aaaaaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>All FYSC Season 1 Channels</h1>

    <div class="search-container">
        <!-- Native submit override blocks default webpage refresh wipes completely -->
        <form onsubmit="filterChannels(); return false;" style="display: flex; gap: 10px;">
            <input type="text" id="userInput" placeholder="Search user..." oninput="filterChannels()">
            <button type="submit" class="search-btn">Search User</button>
        </form>
    </div>

    <div id="statusMessage">Syncing live channel directory cards...</div>
    <div class="channels-grid" id="channelsGrid"></div>

    <script>
        let masterChannelsList = [];

        // FIXED UNBLOCKED DIRECT FEED INTEGRATION: Catches the raw user lists seamlessly
        window.lceditResponseHandler = function(payload) {
            const statusMessage = document.getElementById("statusMessage");
            try {
                // Ingest raw data list from lcedit standard background data mapping
                const incomingData = payload.data || payload.channels || payload.counters || [];
                
                if (incomingData.length > 0) {
                    masterChannelsList = incomingData;
                    
                    // Sort descending automatically so rank values match your standings layout
                    masterChannelsList.sort((a, b) => Number(b.count || 0) - Number(a.count || 0));
                    
                    if (statusMessage) statusMessage.style.display = "none";
                    renderGridHTML(masterChannelsList);
                }
            } catch (err) {
                console.error("Format parsing block conflict:", err);
            }
        };

        function fetchLiveStreamData() {
            const dynamicScript = document.createElement('script');
            // FIX: Using lcedit's root asset script endpoint which completely ignores browser CORS parameters
            dynamicScript.src = 'https://lcedit.com' + Date.now();
            
            const existingScript = document.getElementById('lcedit-automation-bridge');
            if (existingScript) existingScript.remove();
            
            dynamicScript.id = 'lcedit-automation-bridge';
            document.body.appendChild(dynamicScript);
        }

        // Fetch data immediately upon initial website load
        fetchLiveStreamData();

        // Silently loop-sync in the background every 10 seconds to catch newly typed !add chat commands
        setInterval(fetchLiveStreamData, 10000);

        function renderGridHTML(listToRender) {
            const grid = document.getElementById("channelsGrid");
            grid.innerHTML = "";

            listToRender.forEach(user => {
                // Computes the absolute leaderboard placement index across your complete registry list
                const trueRank = masterChannelsList.indexOf(user) + 1;
                const currentCount = Math.floor(Number(user.count || 0));
                const avatarImg = user.image || "https://placeholder.com";

                const card = document.createElement("div");
                card.className = "channel-card";
                card.innerHTML = `
                    <div class="rank-badge">#${trueRank}</div>
                    <div class="card-header">
                        <img class="avatar" src="${avatarImg}" alt="Avatar">
                        <span class="channel-name">${user.name}</span>
                    </div>
                    <div class="sub-count-line">
                        Subscribers:
                        <span class="sub-number">${currentCount.toLocaleString()}</span>
                    </div>
                    <div class="card-actions">
                        <button class="action-btn" onclick="alert('Viewing live count for ${user.name}')">Live Subcount</button>
                        <a class="action-btn" href="https://youtube.com" target="_blank">Go to Channel</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterChannels() {
            const query = document.getElementById("userInput").value.trim().toLowerCase();
            if (query === "") {
                renderGridHTML(masterChannelsList);
                return;
            }
            const filtered = masterChannelsList.filter(user => 
                (user.name || "").toString().toLowerCase().includes(query)
            );
            renderGridHTML(filtered);
        }
    </script>
</body>
</html>
