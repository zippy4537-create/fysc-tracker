<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .panel {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        background: radial-gradient(circle at top left, #241a45, #100b28 70%);
        border: 2px solid #d4af37;
        border-radius: 10px;
        padding: 14px 22px;
        color: #ffffff;
        width: fit-content;
        position: relative;
        overflow: hidden;
    }
    .stars {
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(1px 1px at 20% 30%, white, transparent),
            radial-gradient(1px 1px at 60% 70%, white, transparent),
            radial-gradient(1px 1px at 80% 20%, white, transparent),
            radial-gradient(1px 1px at 40% 85%, white, transparent),
            radial-gradient(1px 1px at 90% 60%, white, transparent);
        opacity: 0.6;
        pointer-events: none;
    }
    .clock-icon {
        font-size: 28px;
        z-index: 1;
    }
    .time-block { text-align: left; z-index: 1; }
    .date-line {
        font-size: 13px;
        color: #d4af37;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .time-line {
        font-size: 24px;
        font-weight: 800;
        font-family: 'Courier New', monospace;
        color: #ffffff;
        line-height: 1.15;
    }
    .tz-label {
        font-size: 11px;
        color: #b9a9e0;
        margin-left: 4px;
    }
    .host-line {
        margin-top: 3px;
        font-size: 11px;
        color: #b9a9e0;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
</style>
</head>
<body>

<div class="panel">
    <div class="stars"></div>
    <div class="clock-icon">&#128337;</div>
    <div class="time-block">
        <div class="date-line" id="dateLine">--/--/----</div>
        <div class="time-line" id="timeLine">--:--:-- <span class="tz-label" id="tzLabel"></span></div>
        <div class="host-line">Stream hosted from space-node.net</div>
    </div>
</div>

<script>
    function pad(n) { return n.toString().padStart(2, "0"); }

    function updateClock() {
        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const year = now.getFullYear();

        let hours = now.getHours();
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        if (hours === 0) hours = 12;

        document.getElementById("dateLine").textContent = `${month}/${day}/${year}`;
        document.getElementById("timeLine").innerHTML =
            `${pad(hours)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;

        const offsetMin = -now.getTimezoneOffset();
        const sign = offsetMin >= 0 ? "+" : "-";
        const offsetHrs = Math.abs(offsetMin) / 60;
        document.getElementById("tzLabel").textContent = `UTC${sign}${offsetHrs}`;
    }

    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
